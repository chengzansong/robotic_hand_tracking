# Tuning T5: half model on the y mid-plane vs the full smoke model.
# Same load, material, mesh size, and solver as the full-model reference
# (Newton, 4 substeps, 24 threads, contact off); only the symmetry changes.
name = "tune_half_y"
design = "finger_poc"
backend = "febio"
bulk_to_shear = 100.0

[materials]
top = "_placeholder_neo_hookean"
base = "_placeholder_neo_hookean"

[mesh]
size_mm = 4.0
wall_size_mm = 1.5
wall_distance_mm = 2.0
symmetry = "half_y"

[load]
case = "free"
pressure_kPa = 2.0
steps = 4

[contact]
enabled = false

[solver]
max_ups = 0
substeps = 4
threads = 24
