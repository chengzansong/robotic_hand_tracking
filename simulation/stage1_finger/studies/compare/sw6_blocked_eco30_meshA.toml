# SW-6 blocked tip force: tip face held in z (half model, so the full force is 2x the logged reaction).
# Mesh A (4 / 1.5 mm) reads ~8% stiff (SW-4): compare against cmp_eco30_meshA, not absolute.
# 12 threads so two runs can share the CPU.
name = "sw6_blocked_eco30_meshA"
design = "finger_poc"
backend = "febio"
bulk_to_shear = 100.0
[mesh]
size_mm = 4.0
wall_size_mm = 1.5
wall_distance_mm = 2.0
symmetry = "half_y"
[contact]
enabled = true
fric_coeff = 0.0
[solver]
max_ups = 0
substeps = 2
aggressiveness = 1
threads = 12
symmetric_stiffness = "non-symmetric"
pressure_symmetric = false
[materials]
top = "ecoflex_00-30"
base = "ecoflex_00-30"
[load]
case = "blocked_force"
levels_kPa = [1, 2, 3, 4, 5]
